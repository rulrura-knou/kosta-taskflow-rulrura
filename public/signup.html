<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskFlow — 회원가입</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))</script>
<style id="theme">
:root,[data-theme=light]{--bg:#f8fafc;--surface:#ffffff;--surface2:#f1f5f9;--text:#1e293b;--text2:#64748b;--border:#e2e8f0}
[data-theme=dark]{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--text:#f1f5f9;--text2:#94a3b8;--border:#334155}
[data-theme=dark] body{background-color:var(--bg)!important;color:var(--text)!important}
[data-theme=dark] .bg-white{background-color:var(--surface)!important}
[data-theme=dark] .bg-slate-100{background-color:var(--bg)!important}
[data-theme=dark] .bg-slate-50{background-color:var(--surface2)!important}
[data-theme=dark] .bg-slate-800{background-color:#0f172a!important}
[data-theme=dark] .text-slate-800,[data-theme=dark] .text-slate-900{color:var(--text)!important}
[data-theme=dark] .text-slate-700,[data-theme=dark] .text-slate-600{color:var(--text2)!important}
[data-theme=dark] .text-slate-500{color:#94a3b8!important}
[data-theme=dark] .text-slate-400{color:#475569!important}
[data-theme=dark] .border-slate-200,[data-theme=dark] .border-slate-100{border-color:var(--border)!important}
[data-theme=dark] input,[data-theme=dark] textarea,[data-theme=dark] select{background-color:var(--surface2)!important;color:var(--text)!important;border-color:var(--border)!important}
[data-theme=dark] input::placeholder,[data-theme=dark] textarea::placeholder{color:#475569!important}
[data-theme=dark] .shadow-sm{box-shadow:0 1px 3px rgba(0,0,0,.5)!important}
[data-theme=dark] .shadow-xl{box-shadow:0 20px 60px rgba(0,0,0,.7)!important}
[data-theme=dark] .bg-amber-50{background-color:#1c1407!important}
[data-theme=dark] .border-amber-200{border-color:#78350f!important}
[data-theme=dark] .bg-blue-50{background-color:#0c1628!important}
[data-theme=dark] .border-blue-200{border-color:#1e3a8a!important}
[data-theme=dark] .bg-green-50{background-color:#052e16!important}
[data-theme=dark] .border-green-200{border-color:#14532d!important}
[data-theme=dark] .bg-teal-50{background-color:#001a18!important}
[data-theme=dark] .border-teal-200{border-color:#134e4a!important}
[data-theme=dark] .bg-red-50{background-color:#1a0006!important}
[data-theme=dark] .border-red-200{border-color:#7f1d1d!important}
</style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
<div class="w-full max-w-sm">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <div class="flex justify-center mb-6">
      <span class="bg-teal-600 text-white text-lg font-bold px-4 py-2 rounded-xl">TaskFlow</span>
    </div>
    <h1 class="text-xl font-semibold text-slate-800 text-center mb-6">회원가입</h1>

    <div id="err" class="hidden mb-4 px-3 py-2 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg"></div>

    <form id="form" class="space-y-4">
      <div>
        <input id="email" type="email" placeholder="이메일 입력"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
        <p id="emailErr" class="hidden mt-1 text-xs text-amber-600"></p>
      </div>
      <div>
        <input id="password" type="password" placeholder="비밀번호 (8자 이상)"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
        <p id="pwErr" class="hidden mt-1 text-xs text-amber-600"></p>
      </div>
      <button id="btn" type="submit"
        class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 rounded-lg text-sm transition-colors">
        가입하기
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-slate-500">
      이미 계정이 있으신가요?
      <a href="/login.html" class="text-teal-600 hover:underline font-medium">로그인</a>
    </p>
  </div>
</div>

<script src="/app.js"></script>
<script>
  initTheme();
  if (getToken()) location.href = "/login.html";

  const emailInput = document.getElementById("email");
  const pwInput = document.getElementById("password");
  const emailErr = document.getElementById("emailErr");
  const pwErr = document.getElementById("pwErr");

  emailInput.addEventListener("blur", () => {
    const v = emailInput.value;
    if (v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) {
      showError(emailErr, "올바른 이메일 형식이 아닙니다");
    } else hideError(emailErr);
  });

  pwInput.addEventListener("input", () => {
    if (pwInput.value.length > 0 && pwInput.value.length < 8) {
      showError(pwErr, "8자 이상 입력해주세요");
    } else hideError(pwErr);
  });

  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    const errEl = document.getElementById("err");
    const btn = document.getElementById("btn");
    hideError(errEl);

    const email = emailInput.value;
    const password = pwInput.value;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return showError(emailErr, "올바른 이메일 형식이 아닙니다");
    if (password.length < 8) return showError(pwErr, "8자 이상 입력해주세요");

    setLoading(btn, true, "처리 중…");
    try {
      const data = await api("POST", "/auth/signup", { email, password });
      setAuth(data.token, data.user);
      location.href = "/team.html";
    } catch (e) {
      showError(errEl, e.message || "가입 실패");
      setLoading(btn, false);
    }
  });
</script>
<button onclick="toggleTheme()" class="theme-toggle fixed top-4 right-4 z-50 text-lg w-9 h-9 flex items-center justify-center rounded-full bg-white shadow border border-slate-200 hover:bg-slate-50 transition-colors" title="다크 모드">🌙</button>
</body>
</html>
