<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskFlow — 팀 선택</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50">
<header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center">
  <span class="bg-teal-600 text-white text-sm font-bold px-3 py-1 rounded-lg">TaskFlow</span>
  <div class="flex items-center gap-3">
    <span id="userEmail" class="text-xs text-slate-500"></span>
    <button onclick="doLogout()" class="text-xs text-slate-400 hover:text-slate-600">로그아웃</button>
  </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-8">
  <div class="bg-teal-50 border border-teal-200 rounded-lg px-4 py-3 mb-6 text-sm text-teal-700">
    ℹ 아직 팀에 소속되지 않았습니다. 팀을 만들거나 초대코드로 합류하세요.
  </div>

  <div class="grid md:grid-cols-2 gap-6">
    <!-- 새 팀 만들기 -->
    <div class="bg-white rounded-xl border border-slate-200 p-6">
      <h2 class="font-semibold text-slate-800 mb-4">+ 새 팀 만들기</h2>
      <div id="createErr" class="hidden mb-3 text-sm text-red-600"></div>
      <div class="space-y-3">
        <input id="teamName" type="text" placeholder="팀 이름 (1–30자)"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
        <button id="createBtn" onclick="createTeam()"
          class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 rounded-lg text-sm transition-colors">
          만들기
        </button>
      </div>
      <!-- 생성 후 초대코드 표시 -->
      <div id="codeBox" class="hidden mt-4 p-3 bg-teal-50 border border-teal-200 rounded-lg">
        <p class="text-xs text-teal-600 mb-1">초대코드 (멤버에게 공유)</p>
        <div class="flex items-center gap-2">
          <span id="inviteCode" class="font-mono font-bold text-teal-700 text-lg tracking-widest"></span>
          <button onclick="copyCode()" class="text-xs bg-white border border-teal-300 text-teal-600 px-2 py-1 rounded hover:bg-teal-50">📋복사</button>
        </div>
        <button onclick="location.href='/kanban.html'"
          class="mt-3 w-full bg-teal-600 text-white text-sm py-2 rounded-lg font-medium hover:bg-teal-700">
          칸반 시작하기 →
        </button>
      </div>
    </div>

    <!-- 초대코드로 합류 -->
    <div class="bg-white rounded-xl border border-slate-200 p-6">
      <h2 class="font-semibold text-slate-800 mb-4">초대코드로 합류</h2>
      <div id="joinErr" class="hidden mb-3 text-sm text-red-600"></div>
      <div class="space-y-3">
        <input id="joinCode" type="text" placeholder="ABCD-1234" maxlength="9"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-mono text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-teal-500"
          oninput="this.value=this.value.toUpperCase()">
        <p class="text-xs text-slate-400 text-center">형식: 대문자 4 + 숫자 4 (하이픈 포함)</p>
        <button id="joinBtn" onclick="joinTeam()"
          class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 rounded-lg text-sm transition-colors">
          합류
        </button>
      </div>
      <!-- 합류 확인 미리보기 -->
      <div id="previewBox" class="hidden mt-4 p-3 bg-slate-50 border border-slate-200 rounded-lg">
        <p class="font-semibold text-slate-800" id="previewName"></p>
        <p class="text-xs text-slate-500 mt-1" id="previewInfo"></p>
        <button onclick="confirmJoin()"
          class="mt-3 w-full bg-teal-600 text-white text-sm py-2 rounded-lg font-medium hover:bg-teal-700">
          이 팀에 합류 →
        </button>
      </div>
    </div>
  </div>
</main>

<script src="/app.js"></script>
<script>
  if (!requireNoTeam()) {}
  document.getElementById("userEmail").textContent = getUser()?.email || "";

  function doLogout() {
    api("POST", "/auth/logout");
    clearAuth();
    location.href = "/login.html";
  }

  async function createTeam() {
    const name = document.getElementById("teamName").value.trim();
    const errEl = document.getElementById("createErr");
    const btn = document.getElementById("createBtn");
    hideError(errEl);
    if (!name || name.length > 30) return showError(errEl, "팀 이름은 1-30자여야 합니다");
    setLoading(btn, true);
    try {
      const team = await api("POST", "/teams", { name });
      // Update stored user
      const u = getUser();
      setAuth(getToken(), { ...u, team_id: team.id });
      document.getElementById("inviteCode").textContent = team.invite_code;
      document.getElementById("codeBox").classList.remove("hidden");
      btn.closest(".space-y-3").classList.add("hidden");
    } catch (e) {
      showError(errEl, e.message || "팀 생성 실패");
      setLoading(btn, false);
    }
  }

  function copyCode() {
    navigator.clipboard.writeText(document.getElementById("inviteCode").textContent);
    toast("초대코드가 복사되었습니다", "success");
  }

  let _pendingJoin = null;

  async function joinTeam() {
    const code = document.getElementById("joinCode").value.trim();
    const errEl = document.getElementById("joinErr");
    const btn = document.getElementById("joinBtn");
    hideError(errEl);
    if (!/^[A-Z]{4}-[0-9]{4}$/.test(code)) return showError(errEl, "형식이 올바르지 않습니다 (예: FRNT-2026)");
    setLoading(btn, true);
    try {
      const data = await api("POST", "/teams/join", { invite_code: code });
      _pendingJoin = data;
      document.getElementById("previewName").textContent = data.team.name;
      document.getElementById("previewInfo").textContent = `멤버 ${data.team.member_count}명`;
      document.getElementById("previewBox").classList.remove("hidden");
      setLoading(btn, false);
    } catch (e) {
      showError(errEl, e.message || "합류 실패");
      setLoading(btn, false);
    }
  }

  function confirmJoin() {
    if (!_pendingJoin) return;
    const u = getUser();
    setAuth(getToken(), { ...u, team_id: _pendingJoin.team.id });
    location.href = "/kanban.html";
  }
</script>
</body>
</html>
