<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskFlow — 멤버</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))</script>
<style id="theme">
:root,[data-theme=light]{--bg:#f8fafc;--surface:#ffffff;--surface2:#f1f5f9;--text:#1e293b;--text2:#64748b;--border:#e2e8f0}
[data-theme=dark]{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--text:#f1f5f9;--text2:#94a3b8;--border:#334155}
[data-theme=dark] body{background-color:var(--bg)!important;color:var(--text)!important}
[data-theme=dark] .bg-white{background-color:var(--surface)!important}
[data-theme=dark] .bg-slate-100{background-color:var(--bg)!important}
[data-theme=dark] .bg-slate-50{background-color:var(--surface2)!important}
[data-theme=dark] .bg-slate-800{background-color:#0f172a!important}
[data-theme=dark] .text-slate-800,[data-theme=dark] .text-slate-900{color:var(--text)!important}
[data-theme=dark] .text-slate-700,[data-theme=dark] .text-slate-600{color:var(--text2)!important}
[data-theme=dark] .text-slate-500{color:#94a3b8!important}
[data-theme=dark] .text-slate-400{color:#475569!important}
[data-theme=dark] .border-slate-200,[data-theme=dark] .border-slate-100{border-color:var(--border)!important}
[data-theme=dark] input,[data-theme=dark] textarea,[data-theme=dark] select{background-color:var(--surface2)!important;color:var(--text)!important;border-color:var(--border)!important}
[data-theme=dark] input::placeholder,[data-theme=dark] textarea::placeholder{color:#475569!important}
[data-theme=dark] .shadow-sm{box-shadow:0 1px 3px rgba(0,0,0,.5)!important}
[data-theme=dark] .shadow-xl{box-shadow:0 20px 60px rgba(0,0,0,.7)!important}
[data-theme=dark] .bg-amber-50{background-color:#1c1407!important}
[data-theme=dark] .border-amber-200{border-color:#78350f!important}
[data-theme=dark] .bg-blue-50{background-color:#0c1628!important}
[data-theme=dark] .border-blue-200{border-color:#1e3a8a!important}
[data-theme=dark] .bg-green-50{background-color:#052e16!important}
[data-theme=dark] .border-green-200{border-color:#14532d!important}
[data-theme=dark] .bg-teal-50{background-color:#001a18!important}
[data-theme=dark] .border-teal-200{border-color:#134e4a!important}
[data-theme=dark] .bg-red-50{background-color:#1a0006!important}
[data-theme=dark] .border-red-200{border-color:#7f1d1d!important}
</style>
</head>
<body class="min-h-screen bg-slate-100">
<header class="bg-white border-b border-slate-200 px-4 py-3">
  <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <span class="bg-teal-600 text-white text-sm font-bold px-3 py-1 rounded-lg">TaskFlow</span>
      <span id="teamName" class="text-sm font-medium text-slate-600"></span>
    </div>
    <nav class="flex gap-1">
      <a href="/kanban.html"  class="px-3 py-1.5 text-slate-600 hover:bg-slate-100 text-sm rounded-lg">칸반</a>
      <a href="/chat.html"    class="px-3 py-1.5 text-slate-600 hover:bg-slate-100 text-sm rounded-lg">채팅</a>
      <a href="/members.html" class="px-3 py-1.5 bg-teal-600 text-white text-sm rounded-lg font-medium">멤버</a>
    </nav>
    <button onclick="toggleTheme()" class="theme-toggle text-lg w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 transition-colors" title="다크 모드">🌙</button>
    <button onclick="doLogout()" class="text-xs text-slate-400 hover:text-slate-600">로그아웃</button>
  </div>
</header>

<main class="max-w-xl mx-auto px-4 py-8">
  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
    <div class="px-4 py-3 border-b border-slate-100">
      <h2 class="font-semibold text-slate-800">팀 멤버 <span id="cnt" class="text-slate-400 font-normal text-sm"></span></h2>
    </div>
    <div id="list" class="divide-y divide-slate-100"></div>
  </div>
</main>

<script src="/app.js"></script>
<script>
if (!requireTeam()) {}
const user = getUser();
const teamId = user.team_id;

initTheme();
async function init() {
  const [team, members] = await Promise.all([
    api("GET", `/teams/${teamId}`),
    api("GET", `/teams/${teamId}/members`),
  ]);
  document.getElementById("teamName").textContent = team.name + " 팀";
  document.getElementById("cnt").textContent = `(${members.length})`;
  document.getElementById("list").innerHTML = members
    .sort((a,b) => b.is_owner - a.is_owner)
    .map(m => `
      <div class="flex items-center gap-3 px-4 py-3">
        <div class="w-8 h-8 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center text-sm font-semibold flex-shrink-0">
          ${m.email[0].toUpperCase()}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-slate-800 truncate">${m.email}${m.id === user.id ? " (나)" : ""}</p>
          <p class="text-xs text-slate-400">${m.is_owner ? "★ owner" : "member"} · ${(m.created_at||"").slice(0,10)}</p>
        </div>
      </div>`).join("");
}

function doLogout() { api("POST","/auth/logout"); clearAuth(); location.href="/login.html"; }
init();
</script>
</body>
</html>
