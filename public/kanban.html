<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskFlow — 칸반</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .card[draggable=true]{cursor:grab}
  .card[draggable=true]:active{cursor:grabbing}
  .col-drop{border:2px dashed #0d9488 !important;background:#f0fdfa !important}
</style>
</head>
<body class="min-h-screen bg-slate-100">

<!-- Header -->
<header class="bg-white border-b border-slate-200 px-4 py-3">
  <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <span class="bg-teal-600 text-white text-sm font-bold px-3 py-1 rounded-lg">TaskFlow</span>
      <span id="teamName" class="text-sm font-medium text-slate-600"></span>
    </div>
    <nav class="flex gap-1">
      <a href="/kanban.html" class="px-3 py-1.5 bg-teal-600 text-white text-sm rounded-lg font-medium">칸반</a>
      <a href="/chat.html"   class="px-3 py-1.5 text-slate-600 hover:bg-slate-100 text-sm rounded-lg">채팅</a>
      <a href="/members.html" class="px-3 py-1.5 text-slate-600 hover:bg-slate-100 text-sm rounded-lg">멤버</a>
    </nav>
    <div class="flex items-center gap-2">
      <span id="userEmail" class="text-xs text-slate-500 hidden md:block"></span>
      <button onclick="doLogout()" class="text-xs text-slate-400 hover:text-slate-600">로그아웃</button>
    </div>
  </div>
</header>

<!-- Filter bar -->
<div class="max-w-6xl mx-auto px-4 pt-4 flex items-center justify-between flex-wrap gap-2">
  <div class="flex gap-1">
    <button data-filter="all"        onclick="setFilter('all')"        class="filter-btn px-3 py-1 text-sm rounded-full bg-slate-800 text-white">전체</button>
    <button data-filter="me"         onclick="setFilter('me')"         class="filter-btn px-3 py-1 text-sm rounded-full bg-white text-slate-600 border border-slate-300">@me</button>
    <button data-filter="unassigned" onclick="setFilter('unassigned')" class="filter-btn px-3 py-1 text-sm rounded-full bg-white text-slate-600 border border-slate-300">미할당</button>
  </div>
  <span class="text-xs text-slate-400">정렬: 최근 생성순</span>
</div>

<!-- Board -->
<main class="max-w-6xl mx-auto px-4 py-4 grid grid-cols-1 md:grid-cols-3 gap-4">
  <!-- TODO -->
  <div id="col-TODO" class="bg-amber-50 border border-amber-200 rounded-xl p-3" ondragover="onDragOver(event)" ondrop="onDrop(event,'TODO')" ondragleave="onDragLeave(event)">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold text-amber-700 text-sm">TODO · <span id="cnt-TODO">0</span></h2>
      <button onclick="startAdd('TODO')" class="text-amber-600 hover:text-amber-800 text-lg font-bold leading-none">+</button>
    </div>
    <div id="cards-TODO" class="space-y-2 min-h-8"></div>
    <!-- Inline add form -->
    <div id="add-TODO" class="hidden mt-2 bg-white border-2 border-teal-400 rounded-lg p-2 space-y-2">
      <input id="add-title-TODO" type="text" placeholder="태스크 제목" maxlength="100"
        class="w-full text-sm px-2 py-1 border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-teal-400">
      <select id="add-assignee-TODO" class="w-full text-sm px-2 py-1 border border-slate-200 rounded focus:outline-none">
        <option value="">담당자 선택 (선택사항)</option>
      </select>
      <p class="text-xs text-slate-400">Enter: 저장 · Esc: 취소</p>
    </div>
  </div>

  <!-- DOING -->
  <div id="col-DOING" class="bg-blue-50 border border-blue-200 rounded-xl p-3" ondragover="onDragOver(event)" ondrop="onDrop(event,'DOING')" ondragleave="onDragLeave(event)">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold text-blue-700 text-sm">DOING · <span id="cnt-DOING">0</span></h2>
      <button onclick="startAdd('DOING')" class="text-blue-600 hover:text-blue-800 text-lg font-bold leading-none">+</button>
    </div>
    <div id="cards-DOING" class="space-y-2 min-h-8"></div>
    <div id="add-DOING" class="hidden mt-2 bg-white border-2 border-teal-400 rounded-lg p-2 space-y-2">
      <input id="add-title-DOING" type="text" placeholder="태스크 제목" maxlength="100"
        class="w-full text-sm px-2 py-1 border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-teal-400">
      <select id="add-assignee-DOING" class="w-full text-sm px-2 py-1 border border-slate-200 rounded focus:outline-none"></select>
      <p class="text-xs text-slate-400">Enter: 저장 · Esc: 취소</p>
    </div>
  </div>

  <!-- DONE -->
  <div id="col-DONE" class="bg-green-50 border border-green-200 rounded-xl p-3" ondragover="onDragOver(event)" ondrop="onDrop(event,'DONE')" ondragleave="onDragLeave(event)">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold text-green-700 text-sm">DONE · <span id="cnt-DONE">0</span></h2>
      <button onclick="startAdd('DONE')" class="text-green-600 hover:text-green-800 text-lg font-bold leading-none">+</button>
    </div>
    <div id="cards-DONE" class="space-y-2 min-h-8"></div>
    <div id="add-DONE" class="hidden mt-2 bg-white border-2 border-teal-400 rounded-lg p-2 space-y-2">
      <input id="add-title-DONE" type="text" placeholder="태스크 제목" maxlength="100"
        class="w-full text-sm px-2 py-1 border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-teal-400">
      <select id="add-assignee-DONE" class="w-full text-sm px-2 py-1 border border-slate-200 rounded focus:outline-none"></select>
      <p class="text-xs text-slate-400">Enter: 저장 · Esc: 취소</p>
    </div>
  </div>
</main>

<!-- Task Detail Modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center px-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
    <div class="flex items-center justify-between mb-4">
      <span id="modal-id" class="text-xs text-slate-400 font-mono"></span>
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
    </div>
    <input id="modal-title" type="text" maxlength="100"
      class="w-full text-lg font-semibold text-slate-800 border-b border-slate-200 pb-2 mb-4 focus:outline-none focus:border-teal-400">
    <div class="space-y-3 text-sm">
      <div class="flex items-center gap-2">
        <span class="text-slate-500 w-16">상태</span>
        <div class="flex gap-1" id="modal-status-btns"></div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-slate-500 w-16">담당자</span>
        <select id="modal-assignee" class="text-sm border border-slate-200 rounded px-2 py-1 focus:outline-none"></select>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-slate-500 w-16">생성자</span>
        <span id="modal-creator" class="text-slate-600"></span>
      </div>
    </div>
    <div class="flex gap-2 mt-6">
      <button onclick="saveTask()" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium py-2 rounded-lg">저장</button>
      <button id="modal-delete-btn" onclick="deleteTask()" class="px-4 py-2 border border-red-300 text-red-600 text-sm rounded-lg hover:bg-red-50">🗑 삭제</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
if (!requireTeam()) {}

const user = getUser();
const teamId = user.team_id;
let allTasks = [];
let members = [];
let currentFilter = "all";
let dragTaskId = null;
let editingTask = null;

document.getElementById("userEmail").textContent = user.email;

async function init() {
  try {
    const [team, mems] = await Promise.all([
      api("GET", `/teams/${teamId}`),
      api("GET", `/teams/${teamId}/members`),
    ]);
    document.getElementById("teamName").textContent = team.name + " 팀";
    members = mems;
    populateAssigneeSelects();
    await loadTasks();
  } catch (e) { toast(e.message || "로드 실패", "error"); }
}

function populateAssigneeSelects() {
  ["TODO","DOING","DONE"].forEach(s => {
    const sel = document.getElementById(`add-assignee-${s}`);
    sel.innerHTML = '<option value="">담당자 선택 (선택사항)</option>' +
      members.map(m => `<option value="${m.id}">${m.email}${m.is_owner ? " ★" : ""}</option>`).join("");
  });
}

async function loadTasks() {
  allTasks = await api("GET", `/teams/${teamId}/tasks?filter=${currentFilter}`);
  renderBoard();
}

function renderBoard() {
  ["TODO","DOING","DONE"].forEach(s => {
    const container = document.getElementById(`cards-${s}`);
    const filtered = allTasks.filter(t => t.status === s);
    document.getElementById(`cnt-${s}`).textContent = filtered.length;
    if (filtered.length === 0) {
      container.innerHTML = `<div class="text-xs text-slate-400 text-center py-4">카드 없음${s === "TODO" ? '<br><button onclick="startAdd(\'TODO\')" class="mt-1 text-teal-600 hover:underline">+ 첫 태스크 만들기</button>' : ""}</div>`;
    } else {
      container.innerHTML = filtered.map(t => cardHTML(t)).join("");
    }
  });
}

function cardHTML(t) {
  const assignee = t.assignee_id
    ? `<span class="text-teal-600">@${(t.assignee_email || "").split("@")[0]}</span>`
    : `<span class="text-amber-500">⚠미할당</span>`;
  return `<div class="card bg-white border border-slate-200 rounded-lg p-3 shadow-sm hover:shadow-md transition-shadow cursor-pointer"
    draggable="true" data-id="${t.id}"
    ondragstart="onDragStart(event,${t.id})"
    onclick="openModal(${t.id})">
    <p class="text-sm font-medium text-slate-800 mb-1.5">${escHtml(t.title)}</p>
    <p class="text-xs text-slate-400">#${t.id} · ${assignee}</p>
  </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Filter ────────────────────────────────────────────────────────────────────
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => {
    b.classList.toggle("bg-slate-800", b.dataset.filter === f);
    b.classList.toggle("text-white", b.dataset.filter === f);
    b.classList.toggle("bg-white", b.dataset.filter !== f);
    b.classList.toggle("text-slate-600", b.dataset.filter !== f);
  });
  loadTasks();
}

// ── Inline Add ────────────────────────────────────────────────────────────────
function startAdd(status) {
  ["TODO","DOING","DONE"].forEach(s => document.getElementById(`add-${s}`).classList.add("hidden"));
  const form = document.getElementById(`add-${status}`);
  form.classList.remove("hidden");
  const inp = document.getElementById(`add-title-${status}`);
  inp.value = "";
  inp.focus();
  inp.onkeydown = async e => {
    if (e.key === "Enter") { e.preventDefault(); await submitAdd(status); }
    if (e.key === "Escape") form.classList.add("hidden");
  };
}

async function submitAdd(status) {
  const title = document.getElementById(`add-title-${status}`).value.trim();
  const assignee_id = document.getElementById(`add-assignee-${status}`).value || null;
  if (!title) return;
  try {
    await api("POST", `/teams/${teamId}/tasks`, { title, assignee_id: assignee_id ? parseInt(assignee_id) : null, status });
    document.getElementById(`add-${status}`).classList.add("hidden");
    await loadTasks();
  } catch (e) { toast(e.message || "생성 실패", "error"); }
}

// ── Drag & Drop ───────────────────────────────────────────────────────────────
function onDragStart(e, id) { dragTaskId = id; e.dataTransfer.effectAllowed = "move"; }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add("col-drop"); }
function onDragLeave(e) { e.currentTarget.classList.remove("col-drop"); }
async function onDrop(e, newStatus) {
  e.preventDefault();
  e.currentTarget.classList.remove("col-drop");
  if (!dragTaskId) return;
  try {
    await api("PATCH", `/tasks/${dragTaskId}/status`, { status: newStatus });
    await loadTasks();
  } catch (ex) { toast(ex.message || "이동 실패", "error"); }
  dragTaskId = null;
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(id) {
  editingTask = allTasks.find(t => t.id === id);
  if (!editingTask) return;
  const t = editingTask;
  document.getElementById("modal-id").textContent = `#${t.id}`;
  document.getElementById("modal-title").value = t.title;
  document.getElementById("modal-creator").textContent = "@" + (t.creator_email || "").split("@")[0];

  // Status buttons
  const btns = document.getElementById("modal-status-btns");
  btns.innerHTML = ["TODO","DOING","DONE"].map(s => `
    <button onclick="setModalStatus('${s}')"
      class="status-btn px-2 py-0.5 text-xs rounded border ${t.status === s ? "bg-teal-600 text-white border-teal-600" : "text-slate-500 border-slate-300 hover:border-teal-400"}">
      ${s}
    </button>`).join("");

  // Assignee select
  const sel = document.getElementById("modal-assignee");
  sel.innerHTML = '<option value="">미할당</option>' +
    members.map(m => `<option value="${m.id}" ${t.assignee_id === m.id ? "selected" : ""}>${m.email}</option>`).join("");

  // Delete button visibility: show only for creator or owner
  const myId = user.id;
  const ownerId = members.find(m => m.is_owner)?.id;
  const canDelete = t.creator_id === myId || ownerId === myId;
  document.getElementById("modal-delete-btn").classList.toggle("hidden", !canDelete);

  document.getElementById("modal").classList.remove("hidden");
}

function setModalStatus(s) {
  editingTask._newStatus = s;
  document.querySelectorAll(".status-btn").forEach(b => {
    const active = b.textContent.trim() === s;
    b.classList.toggle("bg-teal-600", active);
    b.classList.toggle("text-white", active);
    b.classList.toggle("border-teal-600", active);
    b.classList.toggle("text-slate-500", !active);
    b.classList.toggle("border-slate-300", !active);
  });
}

function closeModal() { document.getElementById("modal").classList.add("hidden"); editingTask = null; }

async function saveTask() {
  if (!editingTask) return;
  const title = document.getElementById("modal-title").value.trim();
  const assignee_id = document.getElementById("modal-assignee").value || null;
  const newStatus = editingTask._newStatus || editingTask.status;
  try {
    await api("PUT", `/tasks/${editingTask.id}`, { title, assignee_id: assignee_id ? parseInt(assignee_id) : null });
    if (newStatus !== editingTask.status)
      await api("PATCH", `/tasks/${editingTask.id}/status`, { status: newStatus });
    closeModal();
    await loadTasks();
  } catch (e) { toast(e.message || "저장 실패", "error"); }
}

async function deleteTask() {
  if (!editingTask) return;
  if (!confirm(`'${editingTask.title}' 을(를) 삭제하시겠습니까?`)) return;
  try {
    await api("DELETE", `/tasks/${editingTask.id}`);
    closeModal();
    await loadTasks();
  } catch (e) { toast(e.message || "삭제 실패", "error"); }
}

function doLogout() { api("POST","/auth/logout"); clearAuth(); location.href="/login.html"; }

// Close modal on backdrop click
document.getElementById("modal").addEventListener("click", e => {
  if (e.target === document.getElementById("modal")) closeModal();
});

init();
</script>
</body>
</html>
